name: metrics

on:
  # 每次 push / 每天定时刷新动画指标
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) 拉取当前仓库内容（README 所在）
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) 用 lowlighter/metrics 生成动画 metrics.svg
      #    METRICS_TOKEN 需要在 仓库 Settings -> Secrets and variables -> Actions -> New repository secret 里填入
      #    值 = 一个 classic PAT（勾选 repo / public_repo 权限）。
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header
          base_repositories: 0
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_details: bytes-size, percentage
          plugin_languages_skipped: README
          plugin_calendar: yes
          plugin_calendar_limit: 5
          plugin_stargazers: yes
          plugin_stargazers_when: true
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

      # 3) 把生成的 metrics.svg 提交回仓库，让 README 能引用
      - name: Commit generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          git commit -m "chore: refresh metrics.svg" || echo "no changes to commit"
          git push && echo "pushed"
