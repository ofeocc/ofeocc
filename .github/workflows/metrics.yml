name: metrics

# 完全对照 H2O-ME 的真实配置：
#  - plugin_isocalendar  => 底部那张 3D 等距立体贡献图（就是你要的「3D」）
#  - token 用自动注入的 secrets.GITHUB_TOKEN   => 你不需要手动建任何 secret
#  - committer_message 带 [skip ci]  => 自动提交 SVG 不会触发死循环
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_forks: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_other: no
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_display: large
          committer_message: "chore: update metrics [skip ci]"
